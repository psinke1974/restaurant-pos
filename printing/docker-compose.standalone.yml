services:
  print-server:
    build:
      context: .
      dockerfile: Dockerfile.https
    image: posr-print-https:latest
    ports:
      - "3132:443"
    volumes:
      - ./certs:/certs:ro
    environment:
      # SurrealDB the POS uses; print jobs need a signed-in staff token.
      - POS_AUTH_DB_URL=${POS_AUTH_DB_URL:?Set POS_AUTH_DB_URL, e.g. ws://192.168.1.10:8000}
    restart: unless-stopped
